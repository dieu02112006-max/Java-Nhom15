spring.application.name=java_nhom15

spring.datasource.url=jdbc:mysql://localhost:3306/java_nhom15?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.admin.email=${DAYFLOW_ADMIN_EMAIL:}
app.admin.password=${DAYFLOW_ADMIN_PASSWORD:}