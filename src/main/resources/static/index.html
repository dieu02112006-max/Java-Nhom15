<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>Dayflow — Sống chủ động mỗi ngày</title>
    <link rel="stylesheet" href="/home/home.css">
</head>
<body>
<main id="home">
    <section class="hero" aria-labelledby="hero-title">
        <div class="banner" id="banner" aria-live="polite">
            <div class="banner-row" id="banner-row"></div>
        </div>

        <div class="mascot-area" aria-label="Linh vật Vàng chào bạn">
            <div class="mascot-stage">
                <a class="mascot-bubble" href="/login/index.html">
                    <span><strong>Bấm vào đây để đăng nhập</strong></span>
                </a>
                <a class="mascot-link" href="/login/index.html" aria-label="Đăng nhập">
                    <img class="mascot-img mascot-body" src="/home/mascot-body.png" alt="Linh vật Vàng nhìn thẳng và vẫy tay chào">
                    <img class="mascot-img mascot-arm" src="/home/mascot-arm.png" alt="">
                </a>
            </div>
        </div>
    </section>
</main>

<script src="/shared/auth-context.js"></script>
<script>
(() => {
    // Ảnh mẫu hiện ngay; khi API /api/public/banners trả về thì thay bằng ảnh từ database.
    let list = [
        {title:'Sắp xếp ngày. Sống chủ động.', imageUrl:'/home/banners/banner-1.png'},
        {title:'Hiểu rõ tiền. Chi tiêu thông minh.', imageUrl:'/home/banners/banner-2.png'},
        {title:'Việc nhỏ mỗi ngày. Kết quả lớn.', imageUrl:'/home/banners/banner-3.png'}
    ];
    const row = document.getElementById('banner-row');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TILT = -10 * Math.PI / 180;        // quỹ đạo nghiêng
    const SECONDS_PER_TURN = 12;             // 1 vòng quay = 12 giây
    let items = [], angle = Math.PI / 2, paused = false, last = 0, raf = 0, hovered = -1;
    const layout = () => {
        const W = row.clientWidth, H = row.clientHeight;
        if (!W || !H) return;
        const n = items.length, d = Math.min(H * 0.66, W * 0.42);
        const rx = W * 0.27, ry = H * 0.16;
        items.forEach((el, i) => {
            const t = angle + i * 2 * Math.PI / n;          // góc trên quỹ đạo, sin(t) = 1 là phía trước
            let x = Math.cos(t) * rx, y = Math.sin(t) * ry;
            const rxp = x * Math.cos(TILT) - y * Math.sin(TILT);
            const ryp = x * Math.sin(TILT) + y * Math.cos(TILT);
            const depth = (Math.sin(t) + 1) / 2;               // 0 = sau cùng, 1 = trước nhất
            const h = el._h || 0;                              // 0..1: mức "nổi lên" khi rê chuột
            const scale = (0.62 + 0.38 * depth) + h * (1.3 - (0.62 + 0.38 * depth));
            const lift = -h * d * 0.14;
            el.style.width = el.style.height = d + 'px';
            el.style.transform = `translate(${W / 2 + rxp - d / 2}px, ${H / 2 + ryp - d / 2 + lift}px) scale(${scale})`;
            el.style.zIndex = String(h > 0.02 ? 20 : Math.round(depth * 10));
            el.style.opacity = String(Math.min(1, 0.72 + 0.28 * depth + h));
            el.classList.toggle('front', depth > 0.93 || h > 0.5);
        });
    };
    const tick = ts => {
        if (!last) last = ts;
        const dt = Math.min(ts - last, 60); last = ts;
        if (!paused) angle += dt / 1000 * (2 * Math.PI / SECONDS_PER_TURN);
        items.forEach((el, i) => { el._h = (el._h || 0) + ((hovered === i ? 1 : 0) - (el._h || 0)) * 0.16; });
        layout();
        raf = requestAnimationFrame(tick);
    };
    const start = () => {
        cancelAnimationFrame(raf); row.innerHTML = ''; last = 0;
        items = list.slice(0, 3).map(b => {
            const a = document.createElement('a');
            a.className = 'banner-circle';
            a.href = (b.linkUrl && b.linkUrl.startsWith('/')) ? b.linkUrl : '/login/index.html';
            a.setAttribute('aria-label', b.title || 'Banner');
            const img = document.createElement('img');
            img.src = b.imageUrl; img.alt = b.title || 'Banner';
            a.appendChild(img);
            const on = () => { paused = true; hovered = items.indexOf(a); if (reduce) { items.forEach((e, k) => e._h = k === hovered ? 1 : 0); layout(); } };
            const off = () => { paused = false; hovered = -1; if (reduce) { items.forEach(e => e._h = 0); layout(); } };
            a.addEventListener('mouseenter', on); a.addEventListener('mouseleave', off);
            a.addEventListener('focus', on); a.addEventListener('blur', off);
            row.appendChild(a);
            return a;
        });
        layout();
        if (!reduce) raf = requestAnimationFrame(tick);
    };
    window.addEventListener('resize', layout);
    start();
    fetch('/api/public/banners', {credentials:'same-origin'}).then(r => r.ok ? r.json() : []).then(data => {
        if (Array.isArray(data)) { const l = data.filter(b => b.imageUrl); if (l.length) { list = l; start(); } }
    }).catch(() => {});
})();
</script>
</body>
</html>
