<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fd">
    <title>Xác nhận thanh toán gói — Dayflow</title>
    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #29283b; background: linear-gradient(135deg,#f8e3eb,#e7e5f2 55%,#e0f1ea); }
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
        main { width: min(100%,520px); padding: 28px; border: 1px solid #fff; border-radius: 22px; background: rgb(255 255 255 / 90%); box-shadow: 0 18px 50px rgb(69 57 87 / 14%); }
        h1 { margin: 0 0 8px; font-size: 24px; } p { color: #72768b; line-height: 1.6; }
        dl { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 16px; border-radius: 14px; background: #f2edf5; }
        dt { color: #7b7188; } dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; min-height: 46px; border: 0; border-radius: 12px; color: #fff; background: #548875; font: inherit; font-weight: 700; cursor: pointer; }
        button.reject { background: #c56d86; } button:disabled { opacity: .6; cursor: wait; }
        #message { min-height: 24px; margin-top: 14px; color: #59637a; }
        @media(max-width:480px) { main { padding: 20px; } .actions { flex-direction: column; } }
    </style>
</head>
<body>
<main>
    <h1>Xác nhận thanh toán Dayflow</h1>
    <p>Kiểm tra tài khoản nhận tiền trước khi xác nhận. Chỉ chọn thành công sau khi đã thấy khoản tiền vào tài khoản.</p>
    <dl>
        <dt>Mã giao dịch</dt><dd id="transaction">Đang tải…</dd>
        <dt>Người mua</dt><dd id="customer">—</dd>
        <dt>Gói</dt><dd id="plan">—</dd>
        <dt>Số tiền</dt><dd id="amount">—</dd>
    </dl>
    <div class="actions">
        <button id="approve" type="button" disabled>Xác nhận đã nhận tiền</button>
        <button id="reject" class="reject" type="button" disabled>Xác nhận chưa nhận tiền</button>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
    const token = new URLSearchParams(location.search).get('token');
    const message = document.getElementById('message');
    const amount = value => `${Number(value || 0).toLocaleString('vi-VN')} ₫`;
    const buttons = [document.getElementById('approve'), document.getElementById('reject')];
    if (!token) { message.textContent = 'Liên kết xác nhận thiếu mã bảo mật.'; return; }
    fetch(`/api/packages/payment-review?token=${encodeURIComponent(token)}`, {credentials:'same-origin'})
        .then(async response => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || data.detail || 'Không tải được giao dịch.');
            document.getElementById('transaction').textContent = data.transactionRef;
            document.getElementById('customer').textContent = data.customerName;
            document.getElementById('plan').textContent = data.planCode;
            document.getElementById('amount').textContent = amount(data.amountVnd);
            buttons.forEach(button => button.disabled = false);
        })
        .catch(error => { message.textContent = error.message; });

    async function decide(paid) {
        buttons.forEach(button => button.disabled = true);
        try {
            await fetch('/api/auth/csrf', {credentials:'same-origin'});
            const csrf = document.cookie.split('; ').find(value => value.startsWith('XSRF-TOKEN='));
            const response = await fetch('/api/packages/payment-review', {
                method:'POST', credentials:'same-origin',
                headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrf ? decodeURIComponent(csrf.slice('XSRF-TOKEN='.length)) : ''},
                body:JSON.stringify({token, paid})
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || data.detail || 'Không lưu được xác nhận.');
            message.textContent = data.status === 'PAID' ? 'Đã xác nhận thanh toán thành công. Gói đã được mở cho người mua.' : 'Đã xác nhận thanh toán thất bại. Gói chưa được mở.';
        } catch (error) {
            message.textContent = error.message;
            buttons.forEach(button => button.disabled = false);
        }
    }
    document.getElementById('approve').addEventListener('click', () => decide(true));
    document.getElementById('reject').addEventListener('click', () => decide(false));
})();
</script>
</body>
</html>
